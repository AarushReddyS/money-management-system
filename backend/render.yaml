services:
  - type: web
    name: money-management-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
        # Example: jdbc:mysql://avnadmin:password@mysql-xyz.aivencloud.com:11823/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        # Example: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        # Example: https://your-money-app.vercel.app,http://localhost:5173

